<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloader</title>
<style>
  :root{
    --bg:#0f1218; --panel:#171c26; --panel2:#1d2432; --line:#2a3346;
    --text:#e6ebf4; --muted:#8b96ab; --accent:#4f8ef7; --ok:#3fbf7f; --err:#e5646c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:20px;margin:0 0 18px;display:flex;align-items:center;gap:10px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:16px;margin-bottom:16px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;
        text-transform:uppercase;letter-spacing:.06em}
  input[type=text],select{width:100%;padding:10px 12px;border-radius:8px;
        border:1px solid var(--line);background:var(--panel2);color:var(--text);
        font-size:15px;outline:none}
  input[type=text]:focus,select:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  button{padding:10px 16px;border-radius:8px;border:1px solid var(--line);
         background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  .muted{color:var(--muted);font-size:13px}
  .hidden{display:none!important}
  #results,#formats{max-height:280px;overflow:auto;margin-top:10px;
        border:1px solid var(--line);border-radius:8px}
  .item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;
        display:flex;gap:10px;align-items:baseline}
  .item:last-child{border-bottom:0}
  .item:hover{background:var(--panel2)}
  .item.sel{background:rgba(79,142,247,.15);outline:1px solid var(--accent)}
  .item.bulk{background:rgba(79,142,247,.12);font-weight:600}
  .item.bulk:hover{background:rgba(79,142,247,.22)}
  .item .t{flex:1}
  .item .m{color:var(--muted);font-size:12px;white-space:nowrap}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .presets button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .sugg{position:relative}
  .sugg-list{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--panel2);
        border:1px solid var(--line);border-radius:0 0 8px 8px;max-height:180px;overflow:auto}
  .sugg-list div{padding:8px 12px;cursor:pointer}
  .sugg-list div:hover{background:var(--panel)}
  .job{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;
       background:var(--panel2)}
  .job .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
  .job .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:6px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0%;transition:width .4s}
  .st-finished{color:var(--ok)} .st-error{color:var(--err)} .st-running,.st-queued{color:var(--accent)}
  .st-cancelled{color:var(--muted)}
  .err{color:var(--err);font-size:13px;margin-top:6px;word-break:break-all}
  .job .btn-cancel{padding:3px 10px;font-size:12px;border-radius:6px;flex:0 0 auto}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>Downloader</h1>

  <div class="card">
    <label>Backend</label>
    <select id="dl"></select>

    <div id="searchBox">
      <label>Search</label>
      <div class="row">
        <input type="text" id="q" placeholder="search query…">
        <button id="btnSearch" style="flex:0 0 auto">Search</button>
      </div>
      <div id="results" class="hidden"></div>
    </div>

    <label>Source URL</label>
    <input type="text" id="src" placeholder="https://…">
  </div>

  <div class="card" id="fmtCard">
    <label>Format</label>
    <div class="presets" id="presets">
      <button data-mode="best_video_audio" class="on">Best video+audio</button>
      <button data-mode="best_audio">Best audio</button>
      <button data-mode="best_video_only">Best video only</button>
      <button data-mode="manual" id="btnManual">Manual…</button>
    </div>
    <div id="formats" class="hidden"></div>
    <div class="muted" id="fmtHint" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <label>Destination <span style="text-transform:none">— <span class="muted" id="tokenHint"></span></span></label>
    <div class="sugg">
      <input type="text" id="dest" placeholder="$jellyfin$/shows/…  or  podcasts/…" autocomplete="off">
      <div class="sugg-list hidden" id="suggList"></div>
    </div>
    <div id="metaRow" style="margin-top:10px">
      <label style="display:flex;gap:8px;align-items:center;text-transform:none;
                    letter-spacing:0;font-size:14px;color:var(--text);cursor:pointer">
        <input type="checkbox" id="embedMeta"> Embed metadata (title, artist, date, chapters)
      </label>
    </div>
    <div id="dubRow" style="margin-top:10px" class="hidden">
      <label style="display:flex;gap:8px;align-items:center;text-transform:none;
                    letter-spacing:0;font-size:14px;color:var(--text);cursor:pointer">
        <input type="checkbox" id="dubToggle"> Dubbed (English audio) — default is subbed
      </label>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
      <button class="primary" id="btnGo">Download</button>
      <span class="muted" id="msg"></span>
    </div>
  </div>

  <div class="card">
    <label>Queue</label>
    <div id="jobs"><div class="muted">no downloads yet</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = (p, opt) => fetch(p, opt).then(async r => {
  if(!r.ok){ let d; try{ d = (await r.json()).detail }catch(e){ d = r.statusText }
             throw new Error(d) }
  return r.json();
});

let downloaders = [], caps = null;
let mode = "best_video_audio", manualId = null;
let mediaTokens = [];
// Captured when the user drills into a container (e.g. an anime) so that
// picking any episode underneath it — now or "another ep" later in the same
// session — can immediately suggest the same show folder without retyping.
let currentShowTitle = null, lastAutoDest = "";
// True while a "download all episodes" run is queuing/waiting on jobs —
// guards against starting a second run and lets the Stop control end it
// between episodes (an in-flight download itself is stopped via its own
// per-job Cancel button, same as any other job).
let bulkActive = false;

async function init(){
  downloaders = await api("/downloaders");
  $("dl").innerHTML = downloaders.map(d=>`<option value="${d.id}">${d.name}</option>`).join("");
  onDownloaderChange();
  const ifs = await api("/interfaces");
  mediaTokens = ifs.map(i=>i.token);
  $("tokenHint").textContent = ifs.length
    ? "tokens: " + ifs.map(i=>i.placeholder).join(", ") + " → media libraries; plain paths → downloader storage"
    : "plain paths are relative to downloader storage";
  pollJobs(); setInterval(pollJobs, 1500);
}

// Suggests "$jellyfin$/shows/<Show Title>" (or the first configured media
// token if "jellyfin" isn't one) once a show is known. Never clobbers a
// destination the user typed or edited themselves — only fills an empty
// field, or one still holding our own previous suggestion.
function maybeAutoFillDest(){
  if(!currentShowTitle) return;
  const token = mediaTokens.includes("jellyfin") ? "jellyfin" : mediaTokens[0];
  if(!token) return;
  const clean = currentShowTitle.replace(/[\\/:*?"<>|]/g, "_").trim();
  if(!clean) return;
  const suggested = `$${token}$/shows/${clean}`;
  const cur = $("dest").value.trim();
  if(!cur || cur === lastAutoDest){
    $("dest").value = suggested;
    lastAutoDest = suggested;
  }
}
function onDownloaderChange(){
  caps = downloaders.find(d=>d.id===$("dl").value).capabilities;
  $("searchBox").classList.toggle("hidden", !caps.supports_search);
  $("btnManual").classList.toggle("hidden", !caps.supports_manual_format_select);
  $("metaRow").classList.toggle("hidden", !caps.supports_metadata_embed);
  $("dubRow").classList.toggle("hidden", !caps.supports_dub_toggle);

  // Which preset mode buttons make sense varies by backend (e.g. ani-cli
  // has no separate audio-only/video-only stream to offer).
  const avail = caps.available_modes || ["best_video_audio","best_audio","best_video_only","manual"];
  document.querySelectorAll("#presets button").forEach(b=>{
    b.classList.toggle("hidden", !avail.includes(b.dataset.mode));
  });
  if(!avail.includes(mode)){
    mode = avail[0];
    document.querySelectorAll("#presets button").forEach(b=>b.classList.toggle("on", b.dataset.mode===mode));
    if(mode!=="manual"){ $("formats").classList.add("hidden"); $("fmtHint").textContent="" }
  }

  // Search results/source and any picked manual format are backend-specific
  // tokens — stale ones from the previous backend can't be reused.
  $("results").classList.add("hidden"); $("results").innerHTML = "";
  $("src").value = ""; manualId = null;
  currentShowTitle = null; lastAutoDest = "";
  bulkActive = false;
}
$("dl").onchange = onDownloaderChange;

$("btnSearch").onclick = async () => {
  const q = $("q").value.trim(); if(!q) return;
  $("btnSearch").disabled = true; setMsg("searching…");
  currentShowTitle = null;  // fresh top-level search — old show context is stale
  bulkActive = false;
  try{
    const rs = await api(`/downloaders/${$("dl").value}/search?q=${encodeURIComponent(q)}`);
    renderResults(rs);
    setMsg("");
  }catch(e){ setMsg(e.message, true) }
  $("btnSearch").disabled = false;
};

// Some backends (ani-cli) return two-level results: a top-level pick is a
// container (e.g. an anime) that needs a follow-up search(parent=source)
// to list its leaves (episodes) before there's an actual source to use.
//
// `leaf: true` marks a list as the *episodes of a show just drilled into*
// (as opposed to a top-level search page) — only then is a "download all"
// row offered, so a plain yt-dlp search results list never gets one.
function renderResults(rs, opts){
  const isLeaf = !!(opts && opts.leaf) && rs.length && !rs.some(r=>r.is_container);
  const box = $("results"); box.classList.remove("hidden");
  const bulkRow = isLeaf
    ? `<div class="item bulk" id="bulkAll"><span class="t">⇩ Download all ${rs.length} episodes</span></div>`
    : "";
  box.innerHTML = bulkRow + (rs.map(r=>`<div class="item" data-src="${encodeURIComponent(r.source)}"
       data-title="${encodeURIComponent(r.title)}" data-container="${r.is_container?1:0}">
    <span class="t">${esc(r.title)}${r.is_container?" ›":""}</span>
    <span class="m">${r.uploader?esc(r.uploader):""} ${r.duration_s?fmtDur(r.duration_s):""}</span></div>`).join("")
    || `<div class="item muted">no results</div>`);
  [...box.querySelectorAll(".item[data-src]")].forEach(el=>el.onclick=async ()=>{
    [...box.children].forEach(c=>c.classList.remove("sel")); el.classList.add("sel");
    const src = decodeURIComponent(el.dataset.src);
    if(el.dataset.container === "1"){
      // Remember the show's own title (not the episode's) before drilling in —
      // it's what picking any episode below should suggest a folder from.
      // Auto-fill the destination right now too, not only on a later leaf
      // click — otherwise "Download all episodes" can fire with an empty
      // destination if the user drills in and hits bulk-download without
      // ever clicking a single episode row first.
      currentShowTitle = decodeURIComponent(el.dataset.title);
      maybeAutoFillDest();
      setMsg("loading…");
      try{
        const rs2 = await api(`/downloaders/${$("dl").value}/search?q=&parent=${encodeURIComponent(src)}`);
        renderResults(rs2, {leaf:true});
        setMsg("");
      }catch(e){ setMsg(e.message, true) }
    } else {
      $("src").value = src;
      maybeAutoFillDest();
    }
  });
  if(isLeaf){
    const bulkBtn = $("bulkAll");
    if(bulkBtn) bulkBtn.onclick = () => downloadAllEpisodes(rs);
  }
}

// Queues every episode in `rs` one at a time, waiting for each job to reach
// a terminal state before starting the next — deliberately sequential, not
// parallel: ani-cli's episode/quality lookups scrape anidb.app through
// Cloudflare (see anicli_plugin.py), and firing dozens of concurrent
// scrapes for one "download all" click is exactly the kind of burst that
// gets a run blocked. All episodes share the destination already filled in
// (typically the auto-suggested show folder) and the currently selected
// format preset — manual per-format picks don't carry across episodes, so
// bulk download is only offered while a non-manual preset is active.
async function downloadAllEpisodes(rs){
  if(bulkActive || !rs.length) return;
  if(mode === "manual"){
    setMsg("switch to a preset like “Best video+audio” to download all episodes — a manual format pick is episode-specific", true);
    return;
  }
  bulkActive = true;
  const total = rs.length;
  for(let i=0;i<total;i++){
    if(!bulkActive) break;
    renderBulkProgress(i, total);
    const r = rs[i];
    try{
      const job = await api("/downloads", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          downloader_id: $("dl").value, source: r.source,
          format_selector: {mode, format_id: null},
          destination_path: $("dest").value.trim(),
          options: {embed_metadata: $("embedMeta").checked, dub: $("dubToggle").checked}
        })});
      pollJobs();
      await waitForJob(job.id);
    }catch(e){
      setMsg(`episode ${i+1}/${total} (${r.title}) failed to queue: ${e.message}`, true);
    }
  }
  bulkActive = false;
  removeBulkProgress();
  setMsg("all episodes queued ✓");
  pollJobs();
}

function renderBulkProgress(i, total){
  const el = $("bulkAll");
  if(!el) return;
  el.innerHTML = `<span class="t">queuing episode ${i+1} of ${total}…</span>
    <span class="m"><button id="bulkStop" style="padding:3px 10px;font-size:12px">Stop</button></span>`;
  const stop = $("bulkStop");
  if(stop) stop.onclick = (e) => { e.stopPropagation(); bulkActive = false };
}
function removeBulkProgress(){
  const el = $("bulkAll");
  if(el) el.remove();
}

// Polls a single job until it leaves the queued/running states. Used only
// by the bulk downloader to serialize episodes; the main job list has its
// own independent poll loop (pollJobs) and isn't affected by this one.
function waitForJob(id){
  return new Promise(resolve => {
    const iv = setInterval(async () => {
      try{
        const j = await api(`/downloads/${id}`);
        if(j.status==="finished" || j.status==="error" || j.status==="cancelled"){
          clearInterval(iv); resolve(j);
        }
      }catch(e){ clearInterval(iv); resolve(null) }
    }, 1200);
  });
}
$("q").addEventListener("keydown", e=>{ if(e.key==="Enter") $("btnSearch").click() });

document.querySelectorAll("#presets button").forEach(b=>{
  b.onclick = async () => {
    document.querySelectorAll("#presets button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); mode = b.dataset.mode;
    if(mode==="manual"){ await loadFormats() } else { $("formats").classList.add("hidden"); $("fmtHint").textContent="" }
  };
});
async function loadFormats(){
  const src = $("src").value.trim();
  if(!src){ setMsg("enter a source URL first", true); return }
  $("fmtHint").textContent = "loading formats…";
  try{
    const fs = await api(`/downloaders/${$("dl").value}/formats?source=${encodeURIComponent(src)}`);
    const box = $("formats"); box.classList.remove("hidden");
    box.innerHTML = fs.map(f=>`<div class="item" data-id="${esc(f.format_id)}">
      <span class="t">${esc(f.label)}</span>
      <span class="m">${f.filesize_approx?fmtSize(f.filesize_approx):""}</span></div>`).join("");
    [...box.children].forEach(el=>el.onclick=()=>{
      manualId = el.dataset.id;
      [...box.children].forEach(c=>c.classList.remove("sel")); el.classList.add("sel");
      $("fmtHint").textContent = "selected format " + manualId;
    });
    $("fmtHint").textContent = fs.length + " formats — click one";
  }catch(e){ $("fmtHint").textContent=""; setMsg(e.message, true) }
}

let suggTimer=null;
$("dest").addEventListener("input", ()=>{
  clearTimeout(suggTimer);
  suggTimer=setTimeout(async ()=>{
    try{
      const s = await api(`/paths/suggest?downloader_id=${$("dl").value}&path=${encodeURIComponent($("dest").value)}`);
      const box=$("suggList");
      if(!s.length){ box.classList.add("hidden"); return }
      box.innerHTML = s.map(x=>`<div>${esc(x)}</div>`).join("");
      box.classList.remove("hidden");
      [...box.children].forEach(el=>el.onclick=()=>{
        $("dest").value = el.textContent + "/"; box.classList.add("hidden");
        $("dest").focus(); $("dest").dispatchEvent(new Event("input"));
      });
    }catch(e){}
  }, 200);
});
document.addEventListener("click", e=>{
  if(!e.target.closest(".sugg")) $("suggList").classList.add("hidden");
});

$("btnGo").onclick = async () => {
  const src = $("src").value.trim();
  if(!src){ setMsg("enter a source URL", true); return }
  if(mode==="manual" && !manualId){ setMsg("pick a format first", true); return }
  $("btnGo").disabled = true; setMsg("queuing…");
  try{
    await api("/downloads", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        downloader_id: $("dl").value, source: src,
        format_selector: {mode, format_id: mode==="manual"?manualId:null},
        destination_path: $("dest").value.trim(),
        options: {embed_metadata: $("embedMeta").checked, dub: $("dubToggle").checked}
      })});
    setMsg("queued ✓"); pollJobs();
  }catch(e){ setMsg(e.message, true) }
  $("btnGo").disabled = false;
};

// Delegated once — job cards are replaced wholesale on every poll, so a
// listener bound to individual buttons would go stale.
$("jobs").addEventListener("click", async e => {
  const btn = e.target.closest(".btn-cancel");
  if(!btn) return;
  btn.disabled = true; btn.textContent = "cancelling…";
  try{ await api(`/downloads/${btn.dataset.id}/cancel`, {method:"POST"}); pollJobs() }
  catch(err){ btn.disabled = false; btn.textContent = "Cancel" }
});

async function pollJobs(){
  try{
    const jobs = await api("/downloads");
    if(!jobs.length) return;
    $("jobs").innerHTML = jobs.map(j=>{
      const p = j.progress||{};
      const pct = p.percent!=null ? p.percent : (j.status==="finished"?100:0);
      const speed = p.speed_bps ? fmtSize(p.speed_bps)+"/s" : "";
      const eta = p.eta_s ? "eta "+fmtDur(p.eta_s) : "";
      const size = p.downloaded_bytes
        ? fmtSize(p.downloaded_bytes) + (p.total_bytes ? " / " + fmtSize(p.total_bytes) : "")
        : "";
      const cancellable = j.status === "queued" || j.status === "running";
      const cancelling = p.status === "cancelling";
      const statusLabel = cancelling ? "cancelling…" : j.status;
      return `<div class="job">
        <div class="top">
          <span class="name">${esc(j.title||p.filename||j.source)}</span>
          <span style="display:flex;gap:8px;align-items:center;flex:0 0 auto">
            <span class="st-${j.status}">${statusLabel}</span>
            ${cancellable ? `<button class="btn-cancel" data-id="${j.id}" ${cancelling?"disabled":""}>${cancelling?"cancelling…":"Cancel"}</button>` : ""}
          </span>
        </div>
        <div class="muted" style="font-size:12px;margin-top:2px">→ ${esc(j.destination)}${size?" · "+size:""}${speed?" · "+speed:""}${eta?" · "+eta:""}</div>
        <div class="bar"><i style="width:${pct}%${j.status==='error'?';background:var(--err)':''}"></i></div>
        ${j.result&&j.result.error&&j.status!=='cancelled'?`<div class="err">${esc(j.result.error)}</div>`:""}
      </div>`;
    }).join("");
  }catch(e){}
}

function setMsg(t, err){ const m=$("msg"); m.textContent=t; m.style.color = err?"var(--err)":"var(--muted)" }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])) }
function fmtSize(b){ const u=["B","KB","MB","GB"]; let i=0; while(b>=1024&&i<3){b/=1024;i++} return b.toFixed(b>=10||i===0?0:1)+u[i] }
function fmtDur(s){ s=Math.round(s); const m=Math.floor(s/60), h=Math.floor(m/60);
  return h?`${h}h${String(m%60).padStart(2,"0")}m`:m?`${m}m${String(s%60).padStart(2,"0")}s`:`${s}s` }

init().catch(e=>setMsg("init failed: "+e.message, true));
</script>
</body>
</html>
