services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "568:568"
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/FA_1/media:/media
    environment:
      - JELLYFIN_PublishedServerUrl=http://192.168.68.4:8096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  downloader:
    build: ./downloader
    container_name: downloader
    restart: unless-stopped
    user: "568:568"
    ports:
      - "8790:8790"
      # BitTorrent peer port for the nyaa plugin's qbittorrent-nox — must
      # match _TORRENT_PORT in app/services/torrent_client.py. Also forward
      # this port on the router to this box (UPnP can't punch through
      # Docker's bridge network) or the client stays unreachable from the
      # swarm: stuck in metaDL, seeds=0.
      - "45123:45123/tcp"
      - "45123:45123/udp"
    volumes:
      - /mnt/FA_1/media:/media
      - /mnt/FA_1/media/downloads:/downloads
    environment:
      - MEDIA_TARGETS=jellyfin=/media
      - DOWNLOAD_ROOT=/downloads
      # library-refresh ping after each finished download landing under $jellyfin$
      - NOTIFY_JELLYFIN_URL=http://jellyfin:8096
      - NOTIFY_JELLYFIN_APIKEY=${JELLYFIN_API_KEY:-}
      # optional fallback anime-metadata source if AniList's API is down -- see services/mal.py
      - MAL_CLIENT_ID=${MAL_CLIENT_ID:-}
  jellyfin-upscaler:
    image: kuscheltier/jellyfin-ai-upscaler:docker7-converter
    container_name: jellyfin-upscaler
    environment:
      # Set UPSCALER_API_TOKEN in .env (next to JELLYFIN_API_KEY); the
      # AI Upscaler plugin inside Jellyfin must be given the same token.
      # Defaults to "disable" (no auth) — acceptable only because 5000 is
      # reachable from the LAN alone, never forwarded on the router.
      - API_TOKEN=${UPSCALER_API_TOKEN:-disable}
    volumes:
      - ai-models:/app/models
      - ai-config:/app/config
    ports:
      - "5000:5000"
    restart: unless-stopped
    # GTX 1050 Ti — same nvidia-container-toolkit path the jellyfin
    # service already uses, so the GPU is shared by both containers.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# Named volumes used by jellyfin-upscaler above. Compose refuses to start
# ("refers to undefined volume") unless they're declared here.
volumes:
  ai-models:
  ai-config: