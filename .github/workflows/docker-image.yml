# Builds the jelly-dl image on every push and publishes it to GitHub's
# container registry, so the TrueNAS "dl" app only has to pull it:
#   ghcr.io/xirito/jelly-dl:react-rewrite   (latest commit of that branch)
#   ghcr.io/xirito/jelly-dl:sha-<commit>    (pin one of these to roll back)
name: Build & publish jelly-dl image

on:
  push:
    branches: [react-rewrite, main]
    paths:
      - "downloader/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xirito/jelly-dl
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: downloader
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
